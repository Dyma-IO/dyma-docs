# nginx vhost for dyma-docs (static). Copy to /etc/nginx/sites-available/<host>,
# link it into sites-enabled, then `nginx -t && systemctl reload nginx` and
# `certbot --nginx -d <host>`.
#
# deploy/deploy.sh switches <APP_ROOT>/current atomically; nginx resolves the
# symlink per request, so a deploy or rollback needs no reload.

server {
    listen 80;
    server_name testnet.docs.dyma.io;

    root /home/dyma/testnet.docs.dyma.io/current/build;
    index index.html;

    # Testnet only: keep the testnet docs out of search engines (drop on production).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Docusaurus (trailingSlash: false) writes /docs/intro.html for /docs/intro.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed bundles never change.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    error_page 404 /404.html;
}
