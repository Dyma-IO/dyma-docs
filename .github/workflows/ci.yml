name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build Dyma's site
        run: npm run build
      - name: Build Dyma UTXO's site
        run: npm run build
        env:
          DOCS_EDITION: utxo
          DOCS_URL: https://docs.example.invalid
          DOCS_BASE_URL: /
